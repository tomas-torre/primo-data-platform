[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primo-market"
version = "0.1.0"
description = "Warframe.market data engineering platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "build>=1.2,<2"]

[project.scripts]
primo-market = "primo_market.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
