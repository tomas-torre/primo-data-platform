
bundle:
  name: primo-data-platform

include:
  - resources/*.yml

sync:
  paths:
    - .
    - ../config

artifacts:
  primo_market:
    type: whl
    path: ..
    build: python -m build --wheel

variables:
  environment:
    description: Runtime environment used by notebooks.

  project_src_path:
    description: Path to the project source directory in the Databricks Workspace.
    default: /Workspace/Shared/primo-data-platform/src

  selected_products_path:
    description: Path to the selected products YAML in the Workspace.
    default: ${workspace.file_path}/config/selected_products.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
    variables:
      environment: dev
      # cluster_id: ${env.DATABRICKS_CLUSTER_ID}

  prod:
    mode: production
    workspace:
      root_path: ~/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: "537ca8c0-49d9-4524-bc69-fdc260425c15"  
    variables:
      environment: prod
      # cluster_id: ${env.DATABRICKS_CLUSTER_ID}

      
